org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.nonTransitiveRClass=true
# Chemins de projet contenant des caractères non-ASCII (ex. « D:\D\u00e9veloppement\... ») :
# s\u00fbre sans code natif NDK (WebView pure). Si un build \u00e9choue plus tard avec des
# erreurs aapt/NDK \u00e9tranges, d\u00e9placer le projet vers un chemin ASCII reste la parade.
android.overridePathCheck=true
