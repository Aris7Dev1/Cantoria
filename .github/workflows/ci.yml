name: CI

# Vérifie chaque pull request (dont celles de l'agent) et chaque push sur main.
# Le job « verify » est celui à exiger dans le ruleset de la branche main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

  # Android (issue #58) : build de la coquille + tests unitaires Kotlin
  # sur chaque PR touchant android/. Vérifie aussi le contrat « cantoria.html
  # copié aux assets » via le helper d'installation (sans émulateur requis).
  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy cantoria.html to assets (contrat de la coquille)
        run: node -e "require('fs').copyFileSync('cantoria.html','android/app/src/main/assets/cantoria.html')"

      - name: Build debug APK + run Kotlin tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --no-daemon
