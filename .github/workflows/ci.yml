name: CI

# Vérifie chaque pull request (dont celles de l'agent) et chaque push sur main.
# Le job « verify » est celui à exiger dans le ruleset de la branche main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Check
        run: npm run check

      - name: Test
        run: npm test
