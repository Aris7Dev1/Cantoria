name: Visual explorer

# Explorateur IA (issue #76) : un agent aux commandes du navigateur découvre
# l'app comme un premier utilisateur et poste son RAPPORT D'EXPÉRIENCE en
# commentaire de PR. Consultatif : ne fait jamais échouer une PR.
#
# Déclenchement : dispatch manuel d'abord (coût maîtrisé par le superviseur) ;
# le passage en automatique sur les PR UI sera une décision post-observation.
#
# ⚠️ Zone superviseur.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Numéro de la PR à commenter (vide = pas de commentaire, rapport en log)"
        required: false
        default: ""
      model:
        description: "Modèle vision (défaut : mistral-large-4 ; ex : mistral-small-latest)"
        required: false
        default: "mistral-large-4"

permissions:
  contents: read
  pull-requests: write

jobs:
  explore:
    name: Explorateur IA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Installer Chromium pour Playwright
        run: npx playwright-core install chromium-headless-shell

      - name: Exploration IA
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_BASE_URL: https://api.mistral.ai   # CI uniquement : le dev local passe par la passerelle
          MISTRAL_EXPLORER_MODEL: ${{ github.event.inputs.model || 'mistral-large-4' }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/visual/explorer.js > rapport-exploration.md || true
          cat rapport-exploration.md
          if [ -s rapport-exploration.md ] && [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file rapport-exploration.md || true
          fi
