name: Build and publish Cantoria

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            script: dist:win
            artifact: windows
          - os: macos-latest
            name: macOS
            script: dist:mac
            artifact: macos
          - os: ubuntu-latest
            name: Linux
            script: dist:linux
            artifact: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check and test
        run: |
          npm run check
          npm test

      - name: Configure GitHub publisher
        run: npm run prepare:release
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      # Volet A de l'issue #97 : signature des binaires, conditionnée à la
      # présence des secrets (jamais écrits en clair). Sans secrets, le build
      # reste non signé (comportement actuel) avec un avertissement explicite.
      - name: Sign Windows installer (Authenticode)
        if: runner.os == 'Windows' && secrets.WIN_CSC_LINK != ''
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          echo "Signature Authenticode via certificat fourni en secret (CSC_LINK)."
          npm run dist:win -- --cscLink "$WIN_CSC_LINK" --cscKeyPassword "$WIN_CSC_KEY_PASSWORD"

      - name: "Avertissement : build non signé (aucun secret de signature)"
        if: runner.os == 'Windows' && secrets.WIN_CSC_LINK == ''
        run: echo "::warning::Aucun secret WIN_CSC_LINK -> .exe non signé (SmartScreen avertira)."

      - name: Notarize macOS build (Apple)
        if: runner.os == 'macOS' && secrets.APPLE_API_KEY != ''
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_PASSWORD }}
        run: |
          echo "Signature + notarisation macOS via clés API Apple fournies en secrets."
          npm run dist:mac -- --notarize

      - name: "Avertissement : build macOS non signé/non notarié"
        if: runner.os == 'macOS' && secrets.APPLE_API_KEY == ''
        run: echo "::warning::Aucun secret APPLE_API_KEY -> .dmg non signé (Gatekeeper bloquera)."

      - name: Build installer
        run: npm run ${{ matrix.script }}

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cantoria-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  # Android (issue #58) : APK signé debug (décision superviseur — pas de
  # keystore pour l'instant), nommé d'après la version de package.json
  # (source de vérité unique, lue par app/build.gradle).
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      # Le SDK Android est préinstallé sur les runners ubuntu-latest
      # (ANDROID_HOME=/usr/local/lib/android/sdk). L'action
      # android-actions/setup-android@v3 échoue sur les runners récents
      # (sdkmanager « Failed to find package 'tools' ») et est superflue.

      - name: Copy cantoria.html to assets
        run: node -e "require('fs').copyFileSync('cantoria.html','android/app/src/main/assets/cantoria.html')"

      - name: Build release APK + run Kotlin tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease testReleaseUnitTest --no-daemon

      - name: Rename APK to release naming convention
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist-android/cantoria-${VERSION}-android.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cantoria-android
          path: dist-android/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, android]
    runs-on: ubuntu-latest

    steps:
      - name: Download all platform builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cantoria-*
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
