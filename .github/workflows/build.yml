name: Build and publish Cantoria

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            script: dist:win
            artifact: windows
          - os: macos-latest
            name: macOS
            script: dist:mac
            artifact: macos
          - os: ubuntu-latest
            name: Linux
            script: dist:linux
            artifact: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check and test
        run: |
          npm run check
          npm test

      - name: Configure GitHub publisher
        run: npm run prepare:release
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Build installer
        run: npm run ${{ matrix.script }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cantoria-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  # Android (issue #58) : APK signé debug (décision superviseur — pas de
  # keystore pour l'instant), nommé d'après la version de package.json
  # (source de vérité unique, lue par app/build.gradle).
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Le SDK Android est préinstallé sur les runners ubuntu-latest
      # (ANDROID_HOME=/usr/local/lib/android/sdk). L'action
      # android-actions/setup-android@v3 échoue sur les runners récents
      # (sdkmanager « Failed to find package 'tools' ») et est superflue.

      - name: Copy cantoria.html to assets
        run: node -e "require('fs').copyFileSync('cantoria.html','android/app/src/main/assets/cantoria.html')"

      # Keystore release restauré depuis les secrets (jamais commité, *.jks gitignoré).
      # Sans secrets définis, le build retombe sur la clé debug avec avertissement.
      - name: Restore release keystore from secrets
        if: ${{ secrets.ANDROID_KEYSTORE != '' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          mkdir -p app/build/keystore
          echo "$ANDROID_KEYSTORE" | base64 -d > app/build/keystore/cantoria-release.jks
          ls -la app/build/keystore/

      - name: Build release APK + run Kotlin tests
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease testReleaseUnitTest --no-daemon

      - name: Rename APK to release naming convention
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist-android/cantoria-${VERSION}-android.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cantoria-android
          path: dist-android/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, android]
    runs-on: ubuntu-latest

    steps:
      - name: Download all platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: cantoria-*
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
