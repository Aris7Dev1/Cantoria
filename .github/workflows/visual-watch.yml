name: Visual watchdog

# Watchdog visuel : détection AUTOMATIQUE des problèmes d'interface.
# Chaque lundi sur main (et à la demande) :
#   1. boucle visuelle déterministe (captures Chromium + contrôles + comparaison
#      aux baselines du dépôt) — zéro appel IA, brouillons prêts à relire ;
#   2. explorateur IA : un but de parcours au hasard (explorer-goals.json),
#      plafonds habituels (40 actions / 30 appels, mistral-large-4-0) ;
#   3. fileur (scripts/visual/file-issues.js) : brouillons + rapport deviennent
#      des issues GitHub label `explorer-proposition` — JAMAIS `agent-ok` :
#      l'approbation reste un geste humain du superviseur ;
#   4. rapport de run systématique (GITHUB_STEP_SUMMARY) : brouillons, but tiré,
#      étapes/appels, frictions ou « néant ·, résultat du fileur. Même sans
#      rien à filer, le run laisse une trace lisible — sinon une exploration
#      sans friction et un échec silencieux de l'explorateur sont
#      indiscernables.
#
# Suite de la note de visual-explorer.yml (« le passage en automatique
# décision post-observation ·) : observé via les dispatchs manuels, appliqué ici
# sur main — les PR gardent leurs workflows existants (juge, baselines).
#
# ⚠️ Zone superviseur.

on:
  schedule:
    - cron: "0 7 * * 1"   # lundi 07:00 UTC
  workflow_dispatch:
    inputs:
      goal:
        description: "But d'exploration (vide = but au hasard de explorer-goals.json)"
        required: false
        default: ""
      run_explorer:
        description: "Lancer l'explorateur IA (défaut : oui)"
        type: boolean
        default: true
      max_issues:
        description: "Plafond d'issues créées par run (défaut : 5)"
        required: false
        default: "5"
      dry_run:
        description: "Tout exécuter sans créer les issues"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: visual-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Watchdog visuel
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Installer Chromium pour Playwright
        run: npx playwright-core install chromium-headless-shell

      # Déterministe : sans IA, sans cÃմ— le
      # ceer de la veille. Sort en 0
      # même en cas de violations (elles deviennent des issues) ; un échec
      # ici (crash de capture) doit au contraire être VISIBLE.
      - name: Boucle visuelle déterministe
        run: node scripts/visual/run.js --engine=chromium --out=visual-out

      # Explorateur IA : un but par run, plafonds dans explorer.js. En échec
       #il rend la main (exit 0 dans explorer.js) : le fileur traite un
       # rapport absent ou vide sans rier de fantôme.
      - name: Explorateur IA (but au hasard)
        if: ${{ github.event_name == 'schedule' || inputs.run_explorer }}
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_BASE_URL: https://api.mistral.ai   # CI uniquement : le dev local passe par la passerelle
          MISTRAL_EXPLORER_MODEL: mistral-large-4-0
          EXPLORER_GOAL: ${{ inputs.goal }}
        run: node scripts/visual/explorer.js > rapport-exploration.md || true

      # Le contexte `secrets` n'est pas disponible dans un `if` : on mappe
       #le secret dans `env` et on teste `env.X` (même motif que visual-judge.yml).
      - name: Avertissement si clé absente
        if: env.MISTRAL_API_KEY == ''
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: echo "::warning::MISTRAL_API_KEY absente des secrets — l'explorateur IA est ignoré ; la boucle déterministe tourne quand même."

      - name: Créer le label explorateur-proposition (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create explorer-proposition --color FBCA04 --description "Proposition automatique du Watchdog visuel — à relire avant approbation" || true
          gh label edit explorer-proposition --description "Proposition automatique du Watchdog visuel — à relire avant approbation" || true

      - name: Filer les issues (brouillons + exploration)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          ARGS="--drafts=visual-out/issues-drafts --explorer=rapport-exploration.md --label=explorer-proposition"
          ARGS="$ARGS --max=${{ inputs.max_issues || '5' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS= $ARGS --dry-run"; fi
          node scripts/visual/file-issues.js $ARGS | tee visual-out/fileur.log

      # Rapport de run : répond TOUJOURS (if: always()), même quand il n'y a
      # rien à filer. Écrit dans GITHUB_STEP_SUMMARY — la page « Summary »
      # du run — sans nouvelle permission et sans artefact (quota du plan
      # free). Sans lui, une exploration sans friction et un échec
      # silencieux de l'explorateur sont indiscernables.
      - name: Rapport de run (résumé Watchdog)
        if: always()
        run: |
          {
            echo "## Rapport Watchdog — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
           echo "### Boucle déterministe"
            DROFTVS=$(ls visual-out/issues-drafts/*.md 2>/dev/null | wc -l)
            echo "- Brouillons générés : $DRAFTS"
            echo ""
            echo "<details><summary>Rapport de la boucle (visual-out/report.md)</summary>"
            echo ""
            cat visual-out/report.md 2>/dev/null || echo "_rapport absent (voir le log de la boucle)_"
            echo ""
            echo "</details>"
            echo ""
            echo "### Explorateur IA"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_explorer }}" = "false" ]; then
              echo "- Désactivé sur ce run (dispatch : run_explorer=false)."
            elif [ ! -s rapport-exploration.md ]; then
              echo "- Rapport absent ou vide : clé MISTRAL_API_KEY manquante ou échec silencieux (l'explorateur ne fait jamais échouer le run) — voir l'avertissement du run."
            else
              BUT=$(grep -m1 '^But :' rapport-exploration.md || true)
              [ -n "$BUT" ] || BUT="But : (ligne absente du rapport)"
              PARCOURS=$(grep -m1 '^### Parcours' rapport-exploration.md | sed 's/^### //' || true)
              [ -n "$PARCOURS" ] || PARCOURS="Parcours : (ligne absente du rapport)"
              FRICTIONS=$(awk '/^### Frictions constatées/{f=1;next} f==1 && (/^#{1,3} / || /^\*Rapport/){f=0} f==1 && /^[-*] /{n++} END{print n+0}' rapport-exploration.md)
              echo "- $BUT"
              echo "- $PARCOURS"
              echo "- Frictions : $FRICTIONS"
              echo ""
              echo "<details><summary>Rapport d'exploration complet</summary>"
              echo ""
              cat rapport-exploration.md
              echo ""
              echo "</details>"
            fi
            echo ""
            echo "### Fileur"
            if [ -f visual-out/fileur.log ]; then
              sed 's/^/- /' visual-out/fileur.log
            else
              echo "- Non exécuté (voir les étapes précédentes)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
