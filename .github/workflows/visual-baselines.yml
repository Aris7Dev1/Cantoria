name: Visual baselines

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Scénarios à régénérer (noms séparés par des virgules, vide = tous)"
        required: false
        default: ""
  pull_request:
    paths: ["cantoria.html", "scripts/visual/**", "visual-baseline/**", ".github/workflows/visual-baselines.yml"]

# La régénération dispatchée n'atterrit plus directement sur main : le ruleset
# de main exige une pull request sans contournement, y compris pour
# github-actions[bot]. Elle pousse une branche dédiée, écrasée à chaque
# dispatch, puis ouvre une pull request vers main (fusion = geste superviseur).
# Une pull request créée avec GITHUB_TOKEN ne déclenche pas les workflows
# pull_request (limite anti-récursion GitHub) : fermer puis rouvrir la PR de
# régénération déclenche le contrôle CI (même geste que pour les PR dormantes).

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate-electron:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgbm1
      - run: npm run visual --silent -- --engine=electron --update-baselines ${{ github.event.inputs.scenarios && format('--scenarios={0}', github.event.inputs.scenarios) || '' }}
      - name: Pousser la branche de régénération
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-baseline
          git diff --quiet -- visual-baseline || git commit -m "Baselines visuelles régénérées en CI (scénarios Electron)"
          # Écrasement délibéré : un nouveau dispatch repart d'un état propre.
          # Un échec de push échoue le job (plus d'échec silencieux).
          git push --force origin HEAD:refs/heads/visual/regen-baselines

  regenerate-mobile:
    needs: regenerate-electron
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/regen-baselines
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run visual --silent -- --engine=chromium --update-baselines ${{ (github.event.inputs.scenarios == '' && '--scenarios=library-portrait,player-portrait') || format('--scenarios={0}', github.event.inputs.scenarios) }}
      - name: Compléter la branche de régénération
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-baseline
          git diff --quiet -- visual-baseline || git commit -m "Baselines visuelles régénérées en CI (scénarios mobiles)"
          git push origin HEAD:refs/heads/visual/regen-baselines

  open-pr:
    needs: [regenerate-electron, regenerate-mobile]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/regen-baselines
          fetch-depth: 0
      - name: Ouvrir la pull request de régénération
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet origin/main...HEAD -- visual-baseline; then
            echo "Aucun changement de baseline à proposer."
            exit 0
          fi
          if gh pr list --repo "$GITHUB_REPOSITORY" --head visual/regen-baselines --state open --json number | grep -q number; then
            echo "Une pull request de régénération est déjà ouverte."
            exit 0
          fi
          gh pr create --base main --head visual/regen-baselines \
            --title "Baselines visuelles régénérées en CI" \
            --body "Régénération automatique des baselines visuelles (dispatch manuel du workflow « Visual baselines »). Les changements atterrissent par pull request : le ruleset de main exige une revue humaine. Fermer puis rouvrir cette PR déclenche le contrôle CI ; la fusion reste un geste du superviseur."

  control:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgbm1
      - run: npm run visual --silent -- --engine=electron ${{ github.event.inputs.scenarios && format('--scenarios={0}', github.event.inputs.scenarios) || '' }}
